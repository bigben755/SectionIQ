name: Apply headcode state patch

on:
  push:
    paths:
      - '.github/workflows/apply-headcode-state.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply headcode state patch
        run: python tools/apply_headcode_state_patch.py

      - name: Commit change
        run: |
          if git diff --quiet; then
            echo "No change required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/bodgejob/sectioniq/MainActivity.kt
          git commit -m "Add journey headcode state"
          git push

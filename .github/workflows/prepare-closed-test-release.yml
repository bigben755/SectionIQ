name: Prepare SectionIQ closed test release

on:
  push:
    branches: [main]
    paths:
      - 'tools/prepare_closed_test_release.py'
      - '.github/workflows/prepare-closed-test-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare release
        run: python tools/prepare_closed_test_release.py
      - name: Commit release preparation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dataview/src/App.tsx dataview/src/styles.css app/build.gradle.kts app/src/main/java/com/bodgejob/sectioniq/MainActivity.kt
          if git diff --cached --quiet; then
            echo "No changes required"
            exit 0
          fi
          git commit -m "Prepare SectionIQ closed test release"
          git push

name: Apply headcode capture patch

on:
  push:
    paths:
      - '.github/workflows/apply-headcode-capture.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply headcode capture patch
        run: python tools/apply_headcode_capture_patch.py

      - name: Commit change
        run: |
          if git diff --quiet; then
            echo "No change required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/bodgejob/sectioniq/MainActivity.kt
          git add app/src/main/java/com/bodgejob/sectioniq/JourneyRecordingService.kt
          git add app/src/main/java/com/bodgejob/sectioniq/JourneyUploader.kt
          git commit -m "Capture journey headcode"
          git push

name: Add 1N53 actual demo

on:
  push:
    branches: [main]
    paths:
      - 'tools/add_1n53_demo.py'
      - '.github/workflows/add-1n53-demo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Integrate 1N53 actual journey
        run: python tools/add_1n53_demo.py
      - name: Commit demo integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dataview/src/DemoView.tsx dataview/src/styles.css
          if git diff --cached --quiet; then
            echo "No changes required"
            exit 0
          fi
          git commit -m "Add actual 1N53 journey to demo"
          git push

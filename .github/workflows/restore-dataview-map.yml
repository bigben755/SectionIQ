name: Restore DataView journey map

on:
  push:
    branches: [main]
    paths:
      - 'tools/restore_dataview_map.py'
      - '.github/workflows/restore-dataview-map.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply DataView map restoration
        run: python tools/restore_dataview_map.py

      - name: Commit restored map
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dataview/src/App.tsx dataview/src/JourneyMap.tsx dataview/src/styles.css dataview/package.json
          if git diff --cached --quiet; then
            echo "No changes required"
            exit 0
          fi
          git commit -m "Restore journey map to DataView"
          git push

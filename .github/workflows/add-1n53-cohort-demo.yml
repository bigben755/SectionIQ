name: Add 1N53 comparison cohort

on:
  push:
    branches: [main]
    paths:
      - 'tools/add_1n53_cohort_demo.py'
      - '.github/workflows/add-1n53-cohort-demo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Integrate cohort demo
        run: python tools/add_1n53_cohort_demo.py
      - name: Commit cohort demo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dataview/src/DemoLiveJourney.tsx dataview/src/Demo1N53Cohort.tsx dataview/src/styles.css dataview/package.json
          if git diff --cached --quiet; then
            echo "No changes required"
            exit 0
          fi
          git commit -m "Add large 1N53 comparison cohort"
          git push

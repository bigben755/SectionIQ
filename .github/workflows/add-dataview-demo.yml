name: Add DataView demo

on:
  push:
    branches: [main]
    paths:
      - 'tools/add_dataview_demo.py'
      - '.github/workflows/add-dataview-demo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Integrate demo
        run: python tools/add_dataview_demo.py
      - name: Commit demo integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dataview/src/App.tsx dataview/src/styles.css
          if git diff --cached --quiet; then
            echo "No changes required"
            exit 0
          fi
          git commit -m "Integrate Liverpool Airport demo into DataView"
          git push
